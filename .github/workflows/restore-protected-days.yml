name: Restore protected days

# The workspace cron pushes "public mirror sync — YYYY-MM-DD" with its own
# index.html / README / secondary_ads_module.js. From 10/27 that wiped this
# repo's Ad Channel Throttles tab and the paid-channel / throttles /
# rolling-MER script tags. Before restoring data, the guard keeps this repo's
# UI where the workspace did not change it (3-way merge where it did) and
# takes only the data from the mirror sync.

on:
  push:
    branches: [main]
  schedule:
    # ~10:30 and 11:30 AM ET in both EDT (14:30/15:30) and EST (15:30/16:30).
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-protected-days
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Keep live UI over the mirror sync (scripts/lib/sync_guard.js)
        run: |
          if git log -1 --format=%s | grep -q '^public mirror sync'; then
            node scripts/lib/sync_guard.js --write --sync-grep '^public mirror sync'
          else
            echo "HEAD is not a mirror sync — guard skipped"
          fi
      - name: Detect wipe and restore by merge
        run: node scripts/restore_protected_days.js --apply
      - name: Commit restore if files changed
        run: |
          if git diff --quiet; then
            echo "working tree clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Keep live UI and restore protected days after mirror sync."
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --no-edit && continue
            exit 1
          done
          exit 1
